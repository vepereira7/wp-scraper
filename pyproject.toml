[project]
name = "waterpolo-calendar-scraper"
description = "Scrapes ANNP and FPN calendars and exports the data to multiple formats."
version = "0.1.0"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "pydantic-settings",
]
requires-python = ">=3.11"
readme = "README.md"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterpolo"]